# Render deployment definition (Blueprint).
#
# Two services, because Pedigree is not a single-process app:
#   pedigree-db   FalkorDB, private, reachable only inside the Render network
#   pedigree-api  the existing Dockerfile from this repository
#
# Secrets are generated by Render (generateValue: true). No credential is ever
# written into this file or into the repository.
#
# docker-compose.yml remains the local development and demo path: it hard-codes
# PEDIGREE_SEED_DEMO and cannot pass the production credentials below.
services:
  - type: pserv
    name: pedigree-db
    runtime: docker
    dockerfilePath: ./deploy/falkordb.Dockerfile
    dockerContext: .
    region: oregon
    plan: 0.5c-512mb
    # No disk is declared on purpose. Disks require a paid workspace plan; without
    # one the graph is rebuilt on every restart, which is acceptable for an
    # ephemeral deployment because the API re-seeds its tenant on startup. Add a
    # `disk:` block here to make the graph durable.
    envVars:
      - key: BROWSER
        value: "0"
      # Mandatory query limits - identical to docker-compose.yml and CI.
      - key: FALKORDB_ARGS
        value: "TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 20000 QUERY_MEM_CAPACITY 1073741824"

  - type: web
    name: pedigree-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    # Render generates both secrets on first sync. They are never in Git.
    envVars:
      - key: PEDIGREE_ENV
        value: production
      - key: PEDIGREE_ADMIN_TOKEN
        generateValue: true
      - key: PEDIGREE_SECRET
        generateValue: true
      - key: PEDIGREE_DB_ACL
        value: "false"
      - key: PEDIGREE_NODE_CAP
        value: "200000"
      - key: PEDIGREE_CREDENTIALS_DIR
        value: /data/credentials
      - key: FALKOR_HOST
        fromService:
          name: pedigree-db
          type: pserv
          property: host
      - key: FALKOR_PORT
        fromService:
          name: pedigree-db
          type: pserv
          property: port
      # The app builds public links from this; keep it pointing at the real origin.
      - key: PEDIGREE_PUBLIC_URL
        fromService:
          name: pedigree-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    previews:
      generation: automatic